<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Value Seat — 24/7 Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --background: #faf6ef; --foreground: #2b211b; --card: #fffdf9;
      --primary: #e8572a; --primary-foreground: #fffdf9; --secondary: #f1e9dc;
      --muted: #f4eee4; --muted-foreground: #7a6a5e; --accent: #f5c94f;
      --border: #e7ddcf; --dark: #2b211b; --dark-2: #3a2e26;
      --dark-foreground: #f6f1ea; --destructive: #d93a2b; --radius: 0.75rem;
      --font-sans: "Rubik", ui-sans-serif, system-ui, sans-serif;
      --font-display: "Bricolage Grotesque", "Rubik", ui-sans-serif, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: var(--font-sans); background: var(--background); color: var(--foreground); -webkit-font-smoothing: antialiased; }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .app { display: flex; height: 100dvh; }

    .brand { display: none; position: relative; width: 40%; max-width: 520px; flex-direction: column; justify-content: space-between; padding: 2.5rem; color: var(--dark-foreground); background: var(--dark); overflow: hidden; }
    .brand-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% center; opacity: 0.6; }
    .brand::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(43,33,27,0.95) 10%, rgba(43,33,27,0.4) 60%, rgba(43,33,27,0.7)); }
    .brand > *:not(img) { position: relative; z-index: 1; }
    .brand-title { font-family: var(--font-display); font-size: 2.75rem; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
    .brand-title span { color: var(--accent); }
    .brand-copy { margin-top: 1rem; max-width: 26rem; line-height: 1.6; color: rgba(246,241,234,0.8); }
    .brand-stats { display: flex; gap: 2rem; margin-top: 2rem; }
    .brand-stats dt { font-size: 0.75rem; color: rgba(246,241,234,0.6); }
    .brand-stats dd { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; }
    @media (min-width: 1024px) { .brand { display: flex; } }

    .logo { display: flex; align-items: center; gap: 0.625rem; font-family: var(--font-display); font-weight: 700; font-size: 1.125rem; }
    .logo-mark { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; border-radius: 0.625rem; background: var(--primary); color: var(--primary-foreground); }

    .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.875rem 1.25rem; border-bottom: 1px solid var(--border); background: var(--card); }
    .chat-header .logo { font-size: 1rem; }
    .status { display: flex; align-items: center; gap: 0.375rem; font-size: 0.8125rem; color: var(--muted-foreground); font-family: var(--font-sans); font-weight: 400; }
    .status-dot { width: 0.5rem; height: 0.5rem; border-radius: 999px; background: #2f9e5b; }
    .header-actions { display: flex; gap: 0.5rem; }
    .icon-btn { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.5rem 0.75rem; border-radius: 999px; border: 1px solid var(--border); font-size: 0.8125rem; font-weight: 500; background: var(--card); transition: background 0.15s; }
    .icon-btn:hover { background: var(--muted); }
    .icon-btn[aria-expanded="true"] { background: var(--secondary); }

    .prefs { border-bottom: 1px solid var(--border); background: var(--muted); padding: 1rem 1.25rem; display: none; }
    .prefs.open { display: block; }
    .prefs-label { font-size: 0.8125rem; font-weight: 600; color: var(--muted-foreground); margin-bottom: 0.5rem; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .chip { padding: 0.375rem 0.875rem; border-radius: 999px; font-size: 0.8125rem; font-weight: 500; border: 1px solid var(--border); background: var(--card); transition: all 0.15s; }
    .chip:hover { border-color: var(--primary); }
    .chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
    .prefs-hint { margin-top: 0.75rem; font-size: 0.75rem; color: var(--muted-foreground); }

    .messages { flex: 1; overflow-y: auto; padding: 1.5rem 1.25rem; scroll-behavior: smooth; }
    .messages-inner { max-width: 46rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
    .row { display: flex; gap: 0.625rem; align-items: flex-end; }
    .row.user { justify-content: flex-end; }
    .avatar { flex-shrink: 0; display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); }
    .bubble { max-width: 80%; padding: 0.75rem 1rem; border-radius: 1.125rem; line-height: 1.55; font-size: 0.9375rem; overflow-wrap: anywhere; }
    .row.bot .bubble { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 0.375rem; }
    .row.user .bubble { background: var(--dark); color: var(--dark-foreground); border-bottom-right-radius: 0.375rem; }
    .bubble p + p, .bubble p + ul, .bubble ul + p { margin-top: 0.5rem; }
    .bubble ul { padding-inline-start: 1.25rem; }
    .bubble li + li { margin-top: 0.25rem; }
    .bubble.error { border-color: var(--destructive); color: var(--destructive); }

    .typing { display: inline-flex; gap: 0.3rem; padding: 0.25rem 0; }
    .typing i { width: 0.45rem; height: 0.45rem; border-radius: 999px; background: var(--muted-foreground); animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: 0.2s; }
    .typing i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: 0.6; } }

    .composer { border-top: 1px solid var(--border); background: var(--card); padding: 0.875rem 1.25rem; }
    .composer-inner { max-width: 46rem; margin: 0 auto; display: flex; gap: 0.625rem; align-items: flex-end; }
    textarea { flex: 1; resize: none; max-height: 8rem; padding: 0.75rem 1rem; border-radius: 1.125rem; border: 1px solid var(--border); background: var(--background); color: inherit; font: inherit; font-size: 0.9375rem; line-height: 1.4; }
    .send { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); transition: opacity 0.15s; }
    .send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="brand">
      <img class="brand-image" src="{{ url_for('static', filename='hero.png') }}" alt="" />
      <div class="logo"><span class="logo-mark">VS</span> Value Seat</div>
      <div>
        <h1 class="brand-title">Hungry? Ask us <span>anything</span></h1>
        <p class="brand-copy">Great food, honest prices. Ask us anything..</p>
        <dl class="brand-stats">
          <div><dt>Support</dt><dd>24/7</dd></div>
          <div><dt>Languages</dt><dd>EN · AR</dd></div>
        </dl>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <div>
          <div class="logo"><span class="logo-mark" style="width:2rem;height:2rem">VS</span> Value Seat</div>
          <div class="status"><span class="status-dot"></span> Online</div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="prefsBtn" aria-expanded="false" aria-controls="prefs">prefences</button>
          <button class="icon-btn" id="newBtn">New chat</button>
        </div>
      </header>

      <section class="prefs" id="prefs">
        <div class="prefs-label">Choose what applies to you</div>
        <div class="chip-row" id="chips"></div>
        <p class="prefs-hint">These are sent with each message so the assistant keeps them in mind.</p>
      </section>

      <div class="messages" id="messages" aria-live="polite">
        <div class="messages-inner" id="list"></div>
      </div>

      <div class="composer">
        <div class="composer-inner">
          <label for="input" class="sr-only">Your message</label>
          <textarea id="input" rows="1" maxlength="1000" placeholder="Ask about the menu… / اسأل عن القائمة"></textarea>
          <button class="send" id="send" aria-label="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const PREFS = ["Vegetarian", "Halal", "Gluten-free", "Dairy-free", "Nut allergy", "Egg allergy", "Shellfish allergy"];
    const WELCOME = "Welcome to Value Seat! Ask me about our menu, prices or ingredients. Tell me about any allergies and I will suggest safe options.\nمرحبًا بك في Value Seat! اسألني عن القائمة والأسعار والمكونات.";

    const list = document.getElementById("list");
    const box = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const chips = document.getElementById("chips");
    const prefsPanel = document.getElementById("prefs");
    const prefsBtn = document.getElementById("prefsBtn");
    const selected = new Set();
    let sessionId = null;
    let busy = false;

    // --- safe text -> html (escape first, then allow **bold** and "- " lists)
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function inline(s) { return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
    function render(text) {
      let html = "", inList = false, para = [];
      const flush = () => { if (para.length) { html += "<p>" + para.join("<br>") + "</p>"; para = []; } };
      for (const line of escapeHtml(text).split("\n")) {
        const m = line.match(/^\s*[-*•]\s+(.*)/);
        if (m) {
          flush();
          if (!inList) { html += "<ul>"; inList = true; }
          html += "<li>" + inline(m[1]) + "</li>";
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          if (line.trim() === "") flush(); else para.push(inline(line));
        }
      }
      flush();
      if (inList) html += "</ul>";
      return html;
    }

    function addMessage(role, text, isError) {
      const row = document.createElement("div");
      row.className = "row " + role;
      if (role === "bot") {
        const av = document.createElement("div");
        av.className = "avatar";
        av.textContent = "VS";
        av.style.fontSize = "0.7rem";
        row.appendChild(av);
      }
      const b = document.createElement("div");
      b.className = "bubble" + (isError ? " error" : "");
      b.setAttribute("dir", "auto");
      b.innerHTML = render(text);
      row.appendChild(b);
      list.appendChild(row);
      box.scrollTop = box.scrollHeight;
      return row;
    }

    function addTyping() {
      const row = addMessage("bot", "");
      row.querySelector(".bubble").innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      return row;
    }

    async function postJSON(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {})
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Server error " + res.status);
      return data;
    }

    async function startSession() {
      try {
        const data = await postJSON("/start_session");
        sessionId = data.session_id;
      } catch (e) {
        sessionId = null; // /chat will create one if needed
      }
    }

    async function send() {
      const text = input.value.trim();
      if (!text || busy) return;
      busy = true;
      sendBtn.disabled = true;
      addMessage("user", text);
      input.value = "";
      input.style.height = "auto";

      const typing = addTyping();
      try {
        const data = await postJSON("/chat", { session_id: sessionId, query: text, prefs: Array.from(selected) });
        sessionId = data.session_id;
        typing.remove();
        addMessage("bot", data.reply);
      } catch (e) {
        typing.remove();
        addMessage("bot", "Sorry, something went wrong: " + e.message, true);
      } finally {
        busy = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    // --- preferences chips
    PREFS.forEach(name => {
      const c = document.createElement("button");
      c.type = "button";
      c.className = "chip";
      c.textContent = name;
      c.setAttribute("aria-pressed", "false");
      c.addEventListener("click", () => {
        const on = !selected.has(name);
        on ? selected.add(name) : selected.delete(name);
        c.setAttribute("aria-pressed", String(on));
      });
      chips.appendChild(c);
    });
    prefsBtn.addEventListener("click", () => {
      const open = prefsPanel.classList.toggle("open");
      prefsBtn.setAttribute("aria-expanded", String(open));
    });

    // --- new chat
    document.getElementById("newBtn").addEventListener("click", async () => {
      if (sessionId) { try { await postJSON("/api/session/end", { session_id: sessionId }); } catch (e) {} }
      list.innerHTML = "";
      addMessage("bot", WELCOME);
      await startSession();
    });

    // --- input events
    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 128) + "px";
    });

    // --- start
    addMessage("bot", WELCOME);
    startSession();
  </script>
</body>
</html>
